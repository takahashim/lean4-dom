name: CI

on:
  push:
  pull_request:

jobs:
  proofs:
    name: 証明の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build 2>&1 | tee build.log

      # roadmap §11.1: `sorry` が残っていないことを CI で確認する。
      # `lake build` は `sorry` を warning として報告するので、それを error として扱う。
      - name: Reject sorry
        run: |
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::sorry が残っている"
            grep -n "declaration uses 'sorry'" build.log
            exit 1
          fi

      # roadmap §11.1: 公開主定理が propext / Classical.choice / Quot.sound 以外の
      # axiom に依存していないことを確認する。`sorryAx` もここで落ちる。
      - name: Axiom audit
        run: lake env lean Audit.lean

      # roadmap §11.1: 固定 scenario が loader を通り、どの step でも
      # invariant 違反を出さないことを確認する。
      # `Dom/Exec/Invariant.lean` の `runOperations_no_violation` により、
      # 違反が出るなら harness 側の誤りである。
      - name: Fixed scenarios
        run: lake exe dom-model --check test/scenarios

      - name: Run oracle
        run: lake exe dom-model

      # URL Standard 側は WPT の `urltestdata.json` が期待値の表なので、
      # 固定 scenario を自分で書かずにそのまま通せる。
      # IDNA（UTS #46）が要る case は model の対象外として別に数える。
      - name: URL against WPT
        run: lake exe url-model --wpt test/url/wpt-ascii.json
