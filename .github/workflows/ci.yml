name: CI

on:
  push:
  pull_request:

jobs:
  proofs:
    name: 証明の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build 2>&1 | tee build.log

      # roadmap §11.1: `sorry` が残っていないことを CI で確認する。
      # `lake build` は `sorry` を warning として報告するので、それを error として扱う。
      - name: Reject sorry
        run: |
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::sorry が残っている"
            grep -n "declaration uses 'sorry'" build.log
            exit 1
          fi

      # roadmap §11.1: 公開主定理が propext / Classical.choice / Quot.sound 以外の
      # axiom に依存していないことを確認する。`sorryAx` もここで落ちる。
      - name: Axiom audit
        run: lake env lean Audit.lean

      # roadmap §11.1: 固定 scenario が loader を通り、どの step でも
      # invariant 違反を出さないことを確認する。
      # `Dom/Exec/Invariant.lean` の `runOperations_no_violation` により、
      # 違反が出るなら harness 側の誤りである。
      - name: Fixed scenarios
        run: lake exe dom-model --check test/scenarios

      - name: Run oracle
        run: lake exe dom-model

      # URL Standard 側は WPT の `urltestdata.json` が期待値の表なので、
      # 固定 scenario を自分で書かずにそのまま通せる。
      # IDNA（UTS #46）が要る case は model の対象外として別に数える。
      - name: URL against WPT
        run: lake exe url-model --wpt test/url/wpt-ascii.json

      # §6.1 の setter も WPT が `setters_tests.json` で期待値を配っている。
      - name: URL setters against WPT
        run: lake exe url-model --setters test/url/wpt-setters.json

      # UTS #46 の表を渡すと、非 ASCII の host も対象に入る。
      # 表は証明の中ではなく実行時の fixture で、`checkResolved` が仮定を検査する。
      - name: URL against WPT with the UTS #46 table
        run: lake exe url-model --wpt test/url/wpt-ascii.json test/url/uts46-table.json

      - name: URL setters against WPT with the UTS #46 table
        run: lake exe url-model --setters test/url/wpt-setters.json test/url/uts46-table.json

      # §6.2 の `sort` は WPT が配列リテラルで期待値を持っている。
      - name: URLSearchParams against WPT
        run: lake exe url-model --searchparams test/url/wpt-searchparams-sort.json

      # Punycode は RFC 3492 §7.1 が sample strings を持っている。
      - name: Punycode against RFC 3492
        run: lake exe url-model --punycode test/url/rfc3492-punycode.json
