name = "dom"
version = "0.1.0"
defaultTargets = ["Infra", "Dom", "Url", "Selectors", "Trace", "dom-model", "url-model", "spec-trace"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# WHATWG Infra Standard の語彙。`Dom` と `Url` が共有する。
[[lean_lib]]
name = "Infra"

[[lean_lib]]
name = "Dom"

[[lean_lib]]
name = "Url"

# CSS Selectors Level 4。`Dom` の node tree に対する照合。
[[lean_lib]]
name = "Selectors"

[[lean_exe]]
name = "dom-model"
root = "Main"

[[lean_exe]]
name = "url-model"
root = "UrlMain"

# 仕様の step と Lean の定義の対応表。`spec-trace/check.rb` が `spec-trace/dom.json` と突き合わせる。
[[lean_lib]]
name = "Trace"

[[lean_exe]]
name = "spec-trace"
root = "TraceMain"
