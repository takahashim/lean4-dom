- impl: chromium
  scenario: range-delete-contents-across-nodes
  digest: ff6562a05551dd35
  reason: |
    §5.5 deleteContents が record を積む順序。仕様は step 6（original start node が
    CharacterData なら replace data）→ step 7（nodes to remove を外す）→ step 8
    （original end node の replace data）の順で、characterData・childList・childList・
    characterData と積まれる。Chromium は characterData を二つ先に積み、そのあとで
    childList を二つ積む。木の形も live range の端点も一致するので、違うのは
    record の並びだけである。
    https://dom.spec.whatwg.org/#dom-range-deletecontents

- impl: chromium
  scenario: replacechildren-bypasses-validity
  digest: 4ee0c51911eef1aa
  reason: |
    `frag.replaceChildren(frag)` を Chromium が黙って通す。仕様の
    `replaceChildren` は step 2 で "ensure pre-insertion validity of node into
    this before null" を走らせ、その step 2 が「node が parent の
    host-including inclusive ancestor なら HierarchyRequestError」と言う。
    引数が一つの Node なら "convert nodes into a node" はその node をそのまま
    返すので、node と parent は同じ object であり、投げるのが正しい。

    Element なら Chromium も投げる（`div.replaceChildren(div)` は
    HierarchyRequestError）。`frag.appendChild(frag)` も投げる。
    DocumentFragment を自分自身で置き換えたときだけ素通りし、children も
    そのまま残る（no-op になる）。
    https://dom.spec.whatwg.org/#dom-parentnode-replacechildren

- impl: dommy
  scenario: empty-pseudo-allows-white-space
  digest: 26e7fa321f0fe980
  reason: &empty_whitespace |
    Selectors Level 4 の `:empty`（本文固定は `docs/selectors-spec-version.md`）は
    「子が無いか、あっても document white space characters だけ」で、Selectors 3 の
    「空白も子として数える」から変わっている。Dommy はまだ Selectors 3 の読みのままで、
    `<b> </b>`（空白だけの text 一つを子に持つ）を :empty から除外する。

    ただし本文自身が挙げる適合テスト `css/selectors/selectors-empty-001.xml` の negative
    群は `<test6> </test6>`（同じ形）を「:empty に当たってはならない」と assert しており、
    本文の一文目と自分の wpt リストが矛盾している。csswg-drafts#8106
    "[selectors-4] Is current spec for `:empty` web compatible?"（2022-11-19 起票）は
    「どの browser にも実装されていない、web compatible か疑わしい」と問うたまま
    2024-10 の最終コメントでも開いている。つまり Dommy がここで実装や WPT と揃っているのは
    「仕様の改訂に追随できていない」からではなく、**仕様の本文がまだ自分自身の適合テストと
    矛盾したまま決着していない**からである。model は pin した本文の字義（空白は :empty を
    壊さない）に従うが、この行が仕様側の都合で変わる可能性は他の findings より高い。

    jsdom も同じ形で割れる（別 entry）。happy-dom は空白でない text を持つ要素まで
    :empty に含めるという別の不具合を持つので、この根拠には数えていない。
    https://drafts.csswg.org/selectors-4/#the-empty-pseudo
    https://github.com/w3c/csswg-drafts/issues/8106

