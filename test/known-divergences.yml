- impl: chromium
  scenario: tokens-between-attribute-and-prefix-parts
  digest: cd2b71b203660729
  reason: &tokens_between_delims |
    `[class~/**/=u]` の `~` と `=` は二つの delim token で、Selectors §18 の
    `<attr-matcher>` は「token の間に whitespace を置かない」と言う。comment は CSS Syntax の
    tokenizer が読み捨てるので token でも whitespace でもなく、model は通す（findings 43）。

    Chromium・Firefox・WebKit はどれも SyntaxError にする。CSS 2.1 の tokenizer にあった
    include-match token（`~=`）を一つの token として読み、間に comment があると別の
    二つになる、という旧い読みのままと考えられる。jsdom も通さない（findings 43）。
    Dommy は PR #67 で通すようにした。engine が揃って本文と違う形なので、
    model の読みが怪しくないかは `docs/status.md` §「Firefox と WebKit を並べた」で見直した。
    https://drafts.csswg.org/selectors-4/#attribute-selectors
    https://drafts.csswg.org/css-syntax-3/#consume-comment

