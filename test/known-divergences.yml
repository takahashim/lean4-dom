- impl: dommy
  scenario: scope-pseudo-virtual-root-is-featureless
  digest: dcb1b6b4653c29ff
  reason: &scope_virtual_root |
    Selectors Level 4 の `:scope`（本文固定は `docs/selectors-spec-version.md`）は、
    scoping root が真の element でないとき（DocumentFragment のような virtual scoping
    root）、それを「その木の root element の parent としてふるまう featureless な node」
    として扱うと定め、`df.querySelectorAll(":scope > .foo")` を名指しの例に挙げている。
    DOM の "scope-match a selectors string" は受け手をそのまま scoping root として渡すので、
    model はこの読みに従い `.foo` を返す。Dommy は空を返す。

    csswg-drafts#7261 では一時「:scope は真の element しか指せない」という逆の読みが
    有力になった時期があり（2022-05）、それを踏まえて書き直された WPT
    `css/selectors/scope-selector.html`（2022-05-11、wpt#34032）が
    `documentFragment.querySelectorAll(':scope > div').length === 0` を固定している。
    issue は2023-02-16に tabatkins が「その読みは間違いだった、virtual scoping root は
    docfrag 自身に当たる（ただし subject にはなれない）」と明言して再クローズしており、
    DOM 側の定義も変わっていない。つまり Dommy と WPT は、csswg が撤回した読みのほうに
    揃っている。model はここでは実装や WPT ではなく、現行の仕様本文と csswg の最終結論に従う。

    同根の不一致が `scope-pseudo-is-the-document-element` にもある（別 entry）。
    jsdom・happy-dom も同じ形で割れる。
    https://drafts.csswg.org/selectors-4/#the-scope-pseudo
    https://github.com/w3c/csswg-drafts/issues/7261#issuecomment-1435079033

