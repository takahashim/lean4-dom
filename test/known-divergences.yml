  reason: *scope_virtual_root

- impl: dommy
  scenario: scope-pseudo-is-the-document-element
  digest: 8cc5bcc9ef1c06ef
  reason: &scope_document_element |
    `scope-pseudo-virtual-root-is-featureless` と同根。Document は真の element ではない
    ので、model は Selectors の定義どおり Document も virtual scoping root として扱う。
    `document.querySelectorAll(":scope > *")` は document element（html）だけに当たり、
    `document.querySelectorAll(":scope")` は単体では subject になれないので何にも当たらない。

    Dommy は `:scope` を document element そのものと同一視する。`:scope > *` は html の
    子（この scenario では ul）に当たり、`:scope` 単体は html に当たる。csswg-drafts#7261
    で tabatkins が2023-02-16に「document については、現行の browser の挙動（:scope が
    html を返し、:scope > * が body/head を返す）のほうが妥当だと思う。DOM 仕様側を
    直したい」と明言しているのが、まさにこの挙動である。同じコメントで彼自身
    「仕様が書かれているとおりに読めば document.querySelector(':scope > *') は html を
    返すはずだ」とも認めている。つまり Selectors の本文は変わっておらず、DOM 仕様と
    WPT・実装群だけが、まだ書かれていない DOM 仕様の修正を先取りしている。

    この不一致は `test/compare.rb` が最初に割れた step で比較を打ち切るため、
    元は一つの scenario にまとめてあった `scope-pseudo-is-the-scoping-root.json`
    （2026-09-19 に分割）では見えていなかった。分割して初めて表に出た。
    jsdom・happy-dom も同じ形で割れる。
    https://drafts.csswg.org/selectors-4/#the-scope-pseudo
    https://github.com/w3c/csswg-drafts/issues/7261#issuecomment-1435079033

