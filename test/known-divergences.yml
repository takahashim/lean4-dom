# 実装が仕様本文から離れていて、こちらの findings ではないもの。
#
# ここに入れてよいのは **「実装が仕様本文から離れていて、model が本文に従っている」**
# 場合だけである。model のほうが怪しいなら、記録ではなく調査が要る。
# 判断の拠り所は `docs/threats-to-validity.md` §5 にある。
# **oracle は Lean の model だけで、実装の同意で仕様の読みを決めることはしない。**
#
# 各 entry は記録したときの不一致の **形** を digest で固定する。黙って形が
# 変わったら当たらなくなり、ふつうの不一致として出る。消えた divergence も報告する。
#
#   impl:      実装の名前（`IMPL_NAME`）
#   scenario:  固定 scenario の base 名
#   reason:    仕様の根拠と、なぜこちらの findings でないか
#   digest:    `KnownDivergences.digest` が出す 16 桁

- impl: chromium
  scenario: range-adjust-order-on-before
  digest: 96a0c9a73c5e01b3
  reason: &insert_order |
    §4.2.3 insert の step 5（live range の offset 繰り上げ）と step 7（adopt →
    remove → §5.5 pre-remove steps）の順序。仕様の番号は step 5 が先である
    （`pre-insert` に removal は無く、removal は step 7.1 の adopt の中にある）。
    Chromium は removal の調整を先に走らせたかのように振る舞う。

    二つが違う答えになるのは **同じ parent の中で node の index が変わるとき**だけで、
    そこは WPT が試していない。`dom/ranges/Range-mutations.js` の期待値モデルは
    `modifyForRemove` を `insertBefore` の前に当てる（つまり Chromium 寄り）が、
    `insertBeforeTests` の同じ parent の群は「もとの位置へ動かす」だけなので
    old index も new index も 0 で、入れる側の調整が当たらない。残りは別の parent へ
    動かす群なのでやはり割れない。だから Chromium は WPT を通る。

    jsdom は 94301581 "Align node insertion with the DOM Standard"（Domenic
    Denicola、2026-08-01）で仕様の番号どおりに揃えた。30.0.1 以前は Chromium 寄り
    だった。model は仕様の字義と、その jsdom に一致している。

    WPT に「同じ parent の中で index が変わる移動」の case を足せば、どの engine が
    仕様どおりかが初めて固定される。
    https://dom.spec.whatwg.org/#concept-node-insert

