- impl: chromium
  scenario: type-selector-case-follows-namespace
  digest: 5b77e51b1523f02d
  reason: |
    HTML §4.16.2 "Case-sensitivity of selectors" は次のとおり。

    > When comparing a CSS element type selector to the names of HTML elements in HTML
    > documents, the CSS element type selector must first be converted to ASCII lowercase.
    > The same selector when compared to other elements must be compared according to
    > its original case.

    selector を lowercase してから比べるのは HTML element だけで、SVG の `rect` とは
    元の大文字小文字で比べるので `RECT` は当たらない。Chromium は HTML document の中なら
    namespace に依らず type selector を case-insensitive に比べる。

    | selector | Chromium 153 | Firefox 155 | WebKit 26.6 | 本文 |
    | --- | --- | --- | --- | --- |
    | `RECT` が SVG の `rect` に | 当たる | 当たらない | 当たらない | 当たらない |
    | `rect` が script で作った SVG の `RECT` に | 当たる | 当たらない | 当たらない | 当たらない |
    | `foreignobject` が `foreignObject` に | 当たる | 当たらない | 当たらない | 当たらない |
    | `LINEARGRADIENT` が `linearGradient` に | 当たる | 当たらない | 当たらない | 当たらない |
    https://html.spec.whatwg.org/multipage/semantics-other.html#case-sensitivity-of-selectors

